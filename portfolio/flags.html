<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag Stories — Starter</title>
  <link rel="stylesheet" href="styles/flags.css">
</head>
<body>
  <main class="gallery">
    <article class="poster chile-poster">
      <div class="poster-photo chile-photo"></div>
      <div class="flag-chile flag">
        <div class="chile-blue"></div>
        <div class="chile-star"></div>
        <div class="chile-white"></div>
        <div class="chile-red"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>South America</p><h1>CHILE</h1><small>Mountain / Coast</small></div>
    </article>
    <article class="poster denmark-poster">
      <div class="poster-photo denmark-photo"></div>
      <div class="flag-denmark flag">
        <div class="denmark-tl"></div>
        <div class="denmark-t"></div>
        <div class="denmark-tr"></div>
        <div class="denmark-m"></div>
        <div class="denmark-bl"></div>
        <div class="denmark-b"></div>
        <div class="denmark-br"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Scandinavia</p><h1>DENMARK</h1><small>North Sea / Light</small></div>
    </article>
    <article class="poster finland-poster">
      <div class="poster-photo finland-photo"></div>
      <div class="flag-finland flag">
        <div class="finland-tl"></div>
        <div class="finland-t"></div>
        <div class="finland-tr"></div>
        <div class="finland-m"></div>
        <div class="finland-bl"></div>
        <div class="finland-b"></div>
        <div class="finland-br"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Nordic Forests</p><h1>FINLAND</h1><small>Forest / Water</small></div>
    </article>
    <article class="poster car-poster">
      <div class="poster-photo car-photo"></div>
      <div class="flag-car flag">
        <div class="car-l1"></div>
        <div class="car-star"></div>
        <div class="car-l2"></div>
        <div class="car-l3"></div>
        <div class="car-l4"></div>
        <div class="car-m"></div>
        <div class="car-r1"></div>
        <div class="car-r2"></div>
        <div class="car-r3"></div>
        <div class="car-r4"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Central Africa</p><h1>C.A.R.</h1><small>River / Savanna</small></div>
    </article>
  </main>
</body>
</html>
