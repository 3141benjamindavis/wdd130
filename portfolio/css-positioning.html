<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/css-positioning.css">
</head>
<body>
    <main>
        <div class="top-bar">
            <div class="top-left">
                <img class="profile-pic top-item" src="images/profile.jpg" alt="">
                <strong><p class="username top-item">GenericGuy1234</p></strong>
            </div>
            <div class="top-right">
                <p class="timing top-item">20 mins</p>
                <i class="fas fa-ellipsis-v top-item ellipsis"></i>
            </div>
        </div>
        <img class="landscape" src="images/landscape.jpg" alt="">
        <div class="bottom-bar">
            <div class="bottom-left">
                <i class="fas fa-bookmark bottom-item"></i>
                <i class="fas fa-share-alt bottom-item"></i>
                <div class="comments bottom-item">
                    <i class="far fa-comment-alt"></i>
                    <p>125</p>
                </div>
            </div>
            <div class="bottom-right">
                <strong><p>852</p></strong>
                <i class="far fa-heart"></i>
            </div>
        </div>
    </main>
</body>
</html>
